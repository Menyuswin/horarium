<style>
:root{
  --bg:#EDF0EC; --surface:#FAFBF9; --ink:#16252A; --muted:#5A696C; --line:#D2D9D4; --soft:#E3E8E3;
  --tanulas:#4548B0; --munka:#0E6E66; --szabad:#A86C06; --pihenes:#A13F6B; --edzes:#587A12;
  --warn:#8F3210; --warn-bg:#FAE8DC; --ok:#0E6E66;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10191C; --surface:#18252A; --ink:#E6ECE8; --muted:#94A4A5; --line:#2B3B40; --soft:#213036;
    --tanulas:#9A9DF2; --munka:#4FC2B6; --szabad:#E4AE4C; --pihenes:#E58DB4; --edzes:#A9CC5C;
    --warn:#F3B594; --warn-bg:#3A2218; --ok:#4FC2B6;
  }
}
:root[data-theme="dark"]{
  --bg:#10191C; --surface:#18252A; --ink:#E6ECE8; --muted:#94A4A5; --line:#2B3B40; --soft:#213036;
  --tanulas:#9A9DF2; --munka:#4FC2B6; --szabad:#E4AE4C; --pihenes:#E58DB4; --edzes:#A9CC5C;
  --warn:#F3B594; --warn-bg:#3A2218; --ok:#4FC2B6;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.4;
  -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Alegreya",Georgia,"Times New Roman",serif;font-weight:700;margin:0;line-height:1.15}
h1{font-size:1.9rem} h2{font-size:1.25rem;margin:1.6rem 0 .6rem} h3{font-size:1.05rem}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
main{max-width:620px;margin:0 auto;padding:18px 16px 96px}
.muted{color:var(--muted)} .small{font-size:.9rem}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.head .date{color:var(--muted)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{min-height:54px;font-weight:500;font-size:.9rem;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--ink);font-weight:700}
nav .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:4px;vertical-align:middle}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.alert strong{font-weight:700}
.alert .row{margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.sm{min-height:38px;padding:0 12px;font-size:.92rem}
.alert .btn.ghost{color:var(--warn);border-color:currentColor}

.strip{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft);margin:10px 0 8px}
.strip i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.9rem;color:var(--muted)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

.timer{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.timer svg{width:128px;height:128px;flex:none}
.timer .time{font-family:"Alegreya",Georgia,serif;font-weight:700;font-size:26px;fill:var(--ink);font-variant-numeric:tabular-nums}
.timer .info{min-width:0;flex:1}
.timer .info p{margin-bottom:8px}

.days{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.days button{min-height:38px;padding:0 14px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
ul.tasks{list-style:none;margin:0;padding:0}
.task{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;margin-bottom:8px}
.task .top{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 4px}
.task .check{width:44px;height:44px;flex:none;display:grid;place-items:center}
.task .check span{width:22px;height:22px;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-size:14px;line-height:1}
.task.done .check span{background:var(--c);border-color:var(--c);color:var(--surface)}
.task .body{flex:1;min-width:0;text-align:left;padding:6px 2px;min-height:44px}
.task .title{display:block;font-weight:500;overflow-wrap:anywhere}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.task .meta{display:block;font-size:.88rem;color:var(--muted)}
.task .meta em{font-style:normal;color:var(--c);font-weight:700}
.task .late{color:var(--warn);font-weight:700}
.task .play{width:44px;height:44px;flex:none;border-radius:50%;background:var(--c);color:var(--surface);font-size:15px;display:grid;place-items:center}
.task .more{border-top:1px solid var(--line);padding:8px}
.slot{border:1px dashed var(--line);border-radius:10px;padding:11px 14px;color:var(--muted);margin-bottom:8px;font-size:.95rem}

.field{display:block;margin-bottom:10px}
.field>span{display:block;font-weight:500;margin-bottom:4px}
input[type=text],input[type=number],input[type=time],textarea,select{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:76px;resize:vertical}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
.modes button{min-height:42px;border:1px solid var(--line);border-radius:10px;border-left:5px solid var(--c);text-align:left;padding:0 10px}
.modes button[aria-pressed="true"]{background:var(--c);color:var(--surface);font-weight:700;border-color:var(--c)}
.chips button{min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:19px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.chips input{width:86px;min-height:38px}

.wk{margin-bottom:16px}
.wk .lab{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.wk .lab b{color:var(--c)}
.bar{position:relative;height:16px;background:var(--soft);border-radius:8px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--c)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.wk .note{font-size:.9rem;margin-top:4px}
.wk .note.bad{color:var(--warn);font-weight:500}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:var(--muted);font-family:"Alegreya Sans",sans-serif}
.review{border-top:1px solid var(--line);padding:10px 0}
.review p{margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.pills{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.pills button{min-height:54px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.pills button small{color:var(--muted);font-size:.78rem}
.pills button.we{background:var(--soft)}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pills button[aria-pressed="true"] small{color:inherit}
.pills button.today b{text-decoration:underline}
.blk{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--line));border-radius:12px;padding:10px 12px;margin-bottom:8px}
.blk.conf{border-color:var(--warn)}
.blk .bh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.blk .bh h3{flex:1;min-width:0}
.blk .grip{flex:none;align-self:center;min-width:32px;min-height:32px;margin-left:-6px;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.blk.dragging{position:relative;z-index:2;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.blk.dragging .grip{cursor:grabbing}
.blk .bt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem;white-space:nowrap}
.blk .cap{font-size:.88rem;color:var(--muted);margin-top:2px}
.blk .cap.over,.blk .cap.bad{color:var(--warn);font-weight:700}
.blk ul.tasks{margin-top:8px}
.blk .addrow{display:flex;gap:6px;margin-top:8px}
.blk .addrow input{min-width:0}
.travel{color:var(--muted);font-size:.9rem;padding:4px 12px 4px 14px;margin-bottom:8px;border-left:2px dashed var(--line)}
.brow{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:12px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0;padding-top:0}
.brow .full{grid-column:1/-1}
.brow .field{margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.wkgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wkgrid div{border:1px solid var(--line);border-radius:8px;padding:6px 2px;font-size:.82rem;line-height:1.25;min-height:54px}
.wkgrid .ok{background:var(--soft);font-weight:700}
.tgt{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.tgt input{min-height:42px}
@media (prefers-reduced-motion:no-preference){.bar i,.strip i{transition:width .3s}}
.pet-panel{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.pet-btn{flex:none;min-width:44px;min-height:44px;border-radius:16px;background:none;padding:0}
.pet{width:132px;height:132px;display:block;overflow:visible}
.pet-info{min-width:0;flex:1}.pet-info h3{margin:0 0 4px}
.pbar{height:8px;border-radius:4px;background:var(--soft);margin-top:4px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--munka)}
.pet .tail{transform-origin:86px 90px;animation:pet-wag 1.4s ease-in-out infinite}
.pet .eye{animation:pet-blink 5.5s infinite}
.pet .breathe{transform-origin:60px 112px;animation:pet-breathe 3.4s ease-in-out infinite}
.pet #pg{transform-origin:60px 100px}
.pet.fl .breathe{animation:pet-float 3.6s ease-in-out infinite}
@keyframes pet-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pet .head{transform-origin:60px 80px;animation:pet-tilt 9s ease-in-out infinite}
@keyframes pet-tilt{0%,70%,100%{transform:rotate(0)}76%,88%{transform:rotate(-7deg)}}
.pet .tongue,.pet .heart{opacity:0}
.pet .zz{animation:pet-zz 3s ease-in-out infinite}
.pet .tw{animation:pet-tw 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pet.t-spin #pg{animation:pet-spin 1.1s ease-in-out}
.pet.t-hop #pg{animation:pet-hop .9s ease-out}
.pet.t-dance #pg{transform-origin:60px 108px;animation:pet-dance 1.8s ease-in-out}
.pet.t-flip #pg{transform-origin:60px 70px;animation:pet-flip 1.2s ease-in-out}
.pet.t-lick .tongue{animation:pet-lick 1.9s ease-in-out}
.pet.t-hearts .heart{animation:pet-heart 1.9s ease-out both}
.pet.t-hearts .h2{animation-delay:.25s}.pet.t-hearts .h3{animation-delay:.5s}
@keyframes pet-wag{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg)}}
@keyframes pet-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes pet-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.03)}}
@keyframes pet-zz{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:.9;transform:translateY(-6px)}}
@keyframes pet-tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@keyframes pet-spin{0%{transform:scaleX(1)}25%{transform:scaleX(0)}50%{transform:scaleX(-1)}75%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes pet-hop{0%,100%{transform:translateY(0)}25%{transform:translateY(-14px)}50%{transform:translateY(0)}75%{transform:translateY(-9px)}}
@keyframes pet-dance{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(7deg)}}
@keyframes pet-flip{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-22px) rotate(180deg)}80%{transform:translateY(-2px) rotate(360deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes pet-lick{0%{opacity:0;transform:translateX(7px)}10%{opacity:1}35%{transform:translateX(-6px)}60%{transform:translateX(7px)}85%{opacity:1;transform:translateX(-5px)}100%{opacity:0;transform:translateX(0)}}
@keyframes pet-heart{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
@media (prefers-reduced-motion:reduce){.pet *{animation:none!important}}
@media (max-width:420px){.pet-panel{flex-direction:column;align-items:flex-start}}
.intro{max-width:520px;margin:0 auto;padding-top:8px}
.intro h1{margin:6px 0 10px}
.ilead{font-size:1.08rem;margin-bottom:16px}
.ipet{display:flex;justify-content:center;margin:6px 0 4px}.ipet .pet{width:168px;height:168px}
.idots{display:flex;gap:6px;justify-content:center;margin-bottom:10px}.idots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.idots i.on{background:var(--ink);width:20px;border-radius:4px}
.inav{justify-content:flex-end}.inav .btn{min-width:110px}
.ipick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.ipick button{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px}
.ipick button[aria-pressed="true"]{border:2px solid var(--ink);background:var(--soft)}
.ipick .pet{width:84px;height:84px}.ipick span{font-size:.92rem;font-weight:500;line-height:1.2;text-align:center}.ipick em{display:block;font-style:normal;font-size:.75rem;color:var(--muted);font-weight:400}
.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;flex:none}
.ibrand{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 10px}.logo.big{width:58px;height:58px}
.iwm{font-family:"Alegreya",Georgia,serif;font-weight:700;font-size:1.7rem;line-height:1}.itag{font-size:.78rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:3px}
.deep{position:fixed;inset:0;z-index:20;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px 16px;text-align:center;
  --bg:#10191C;--surface:#18252A;--ink:#E6ECE8;--muted:#94A4A5;--line:#2B3B40;--soft:#213036;background:var(--bg);color:var(--ink)}
.deep .dtime{font-family:"Alegreya",Georgia,serif;font-weight:700;font-size:clamp(64px,18vw,120px);line-height:1;font-variant-numeric:tabular-nums}
.deep .dtitle{margin:6px 0 2px}.deep .dintent{font-size:1.1rem;max-width:520px}.deep .dsmall{color:var(--muted);font-size:.9rem}
.deep .daway{color:#E4AE4C;font-size:.95rem;margin-top:4px}.deep .dpet .pet{width:110px;height:110px}
.deep .dchips{justify-content:center;margin-top:14px}.deep .dbtns{justify-content:center;margin-top:10px}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.85rem}
.mcal b{font-weight:500;color:var(--muted);font-size:.78rem}
.mcal span{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;background:var(--soft);color:var(--muted)}
.mcal span:empty{background:none}.mcal .l1{background:color-mix(in srgb,var(--munka) 25%,var(--soft));color:var(--ink)}
.mcal .l2{background:color-mix(in srgb,var(--munka) 50%,var(--soft));color:var(--ink)}.mcal .l3{background:color-mix(in srgb,var(--munka) 75%,var(--soft));color:var(--surface)}
.mcal .l4{background:var(--munka);color:var(--surface);font-weight:700}.mcal .now{outline:2px solid var(--ink);outline-offset:-2px}
:root{--qkn:#E0A12E;--qkk:#0E6E66;--qnn:#C9557F;--qnk:#5A696C}
.feels{display:grid;gap:4px;margin-bottom:10px}.frow{display:flex;flex-wrap:wrap;gap:4px}
.frow button{min-height:36px;padding:0 11px;border-radius:18px;border:1px solid var(--line);font-size:.92rem}
.frow button[aria-pressed="true"]{color:var(--surface);font-weight:700}
.fkn button[aria-pressed="true"]{background:var(--qkn);border-color:var(--qkn)}.fkk button[aria-pressed="true"]{background:var(--qkk);border-color:var(--qkk)}
.fnn button[aria-pressed="true"]{background:var(--qnn);border-color:var(--qnn)}.fnk button[aria-pressed="true"]{background:var(--qnk);border-color:var(--qnk)}
.fkn button{border-left:4px solid var(--qkn)}.fkk button{border-left:4px solid var(--qkk)}.fnn button{border-left:4px solid var(--qnn)}.fnk button{border-left:4px solid var(--qnk)}
.eqcard{border-left:5px solid var(--qkn)}.eqcare{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--soft)}
.breath .bpet{animation:breathe 10s ease-in-out infinite;transform-origin:50% 60%}.breath .bpet .pet{width:150px;height:150px}
.bcirc{width:120px;height:120px;border-radius:50%;background:var(--munka);opacity:.7}
@keyframes breathe{0%,100%{transform:scale(.82)}40%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.breath .bpet{animation:none}}
</style>

<body>
<main id="app"></main>
<nav aria-label="Nézetek"><div id="tabs"></div></nav>
<script>
"use strict";
const MODES={tanulas:"Tanulás",munka:"Munka",szabad:"Szabadprogram",pihenes:"Pihenés",edzes:"Edzés"};
const MK=Object.keys(MODES);
const KEY="horarium-v1";
const DAYS=["H","K","Sze","Cs","P","Szo","V"];
const MONTHS=["január","február","március","április","május","június","július","augusztus","szeptember","október","november","december"];
const DAYNAMES=["vasárnap","hétfő","kedd","szerda","csütörtök","péntek","szombat"];
const WORKOUTS={uszas:"Úszás",torna:"Torna",nincs:"Pihenőnap"};
const MAX_FOCUS_BLOCKS=6;
const BREAK_TIPS=["Álljon fel, és nyújtózzon két percet.","Igyon egy pohár vizet.","Nézzen ki az ablakon húsz másodpercig.","Menjen ki a szobából, és járjon egy kört.","Ne nyissa meg a telefont és a közösségi oldalakat: a szünet pihenés legyen.","Lazítsa el a vállát, és lassan lélegezzen néhányat."];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function blk(start,end,title,mode,kind){const b={id:uid(),start,end,title,mode:mode||""};if(kind)b.kind=kind;return b}
function defTemplates(){return{
  wd:[blk("07:00","08:00","Tanulás","tanulas"),blk("08:00","09:00","Reggeli, készülődés","pihenes"),
      blk("09:00","12:30","Munka","munka"),blk("12:30","13:30","Ebéd","pihenes"),blk("13:30","16:30","Munka","munka"),
      blk("17:00","18:00","Edzés","edzes","edzes"),blk("18:30","20:00","Szabadprogram","szabad"),blk("20:00","22:00","Esti pihenés","pihenes")],
  we:[blk("07:30","08:30","Reggeli, lassú indulás","pihenes"),blk("08:30","10:30","Tanulás","tanulas"),
      blk("11:00","12:00","Edzés","edzes","edzes"),blk("12:30","13:30","Ebéd","pihenes"),
      blk("14:30","18:30","Szabadprogram","szabad"),blk("19:00","22:00","Esti pihenés","pihenes")]}}
function defTargets(){return{tanulas:{wd:5,we:2},munka:{wd:30,we:0},szabad:{wd:7,we:6},pihenes:{wd:15,we:8},edzes:{wd:5,we:2}}}
function defaults(){return{v:2,updatedAt:0,
  settings:{targets:defTargets(),focus:50,brk:10,travel:20,templates:defTemplates(),pet:{on:true,species:"kutya",name:""},eq:{on:true,freq:"napi"}},
  tasks:[],log:{},hourLog:{},reviews:{},timer:null,plan:{},sessions:[],reflect:null,petMins:0,morning:{},onboarded:false,weekly:{},sug:{},feel:[],eqd:{},eqDone:0,breaths:0}}
function normalize(d){d=JSON.parse(JSON.stringify(d||{}));const b=defaults(),ds=d.settings||{};
  const s=Object.assign(b,d);s.v=2;
  s.settings=Object.assign(b.settings,ds);
  const tg=defTargets();MK.forEach(k=>{const t=(ds.targets||{})[k];
    if(t&&typeof t==="object")tg[k]={wd:+t.wd||0,we:+t.we||0};});
  s.settings.targets=tg;
  const tp=ds.templates;
  s.settings.templates=(tp&&Array.isArray(tp.wd)&&Array.isArray(tp.we))?tp:defTemplates();
  s.tasks=Array.isArray(d.tasks)?d.tasks:[];s.log=d.log||{};s.hourLog=d.hourLog||{};s.reviews=d.reviews||{};s.timer=d.timer||null;s.plan=d.plan||{};s.sessions=Array.isArray(d.sessions)?d.sessions:[];s.reflect=d.reflect||null;s.petMins=Math.max(0,+d.petMins||0);
  s.settings.pet=Object.assign({on:true,species:"kutya",name:""},ds.pet||{});
  s.morning=d.morning&&typeof d.morning==="object"?d.morning:{};s.weekly=d.weekly&&typeof d.weekly==="object"?d.weekly:{};s.sug=d.sug&&typeof d.sug==="object"?d.sug:{};
  s.feel=Array.isArray(d.feel)?d.feel:[];s.eqd=d.eqd&&typeof d.eqd==="object"?d.eqd:{};s.eqDone=+d.eqDone||0;s.breaths=+d.breaths||0;
  s.settings.eq=Object.assign({on:true,freq:"napi"},ds.eq||{});
  s.onboarded=d.onboarded!==undefined?!!d.onboarded:!!((Array.isArray(d.tasks)&&d.tasks.length)||(Array.isArray(d.sessions)&&d.sessions.length));
  if(["kutya","macska","nyul","horcsog","felho","moha"].indexOf(s.settings.pet.species)<0)s.settings.pet.species="kutya";
  s.settings.pet.name=String(s.settings.pet.name||"").slice(0,20);return s}

let S=defaults(),view="ma",dayOff=0,openId=null,formMode="munka",formPlan=50,confirmReset=false,confirmDay=false,pendingImport=null,petRename=false,introStep=0,
    flash="",startFor=null,startDur=0,capOpen=false,deep=false,awayNote="",feelSel="",feelOpen=false,breathOn=0,eqAsk=false,syncOn=false,pDate=null,editPlan=false,editId=null,editMode="munka";
/* Edit form for a task that is already on a day. Shown in place of its action row. */
function taskForm(t){return '<div class="panel" style="margin-top:4px"><label class="field"><span class="small">Cím</span><input type="text" id="e-title" maxlength="120" value="'+esc(t.title)+'" autocomplete="off"></label>'+
  '<div class="modes" role="group" aria-label="Mód">'+MK.filter(k=>k!=="edzes").map(k=>'<button data-act="emode" data-k="'+k+'" style="--c:var(--'+k+')" aria-pressed="'+(editMode===k)+'">'+MODES[k]+'</button>').join("")+'</div>'+
  '<label class="field"><span class="small">Tervezett idő (perc)</span><input type="number" id="e-plan" min="5" max="600" step="5" inputmode="numeric" value="'+t.plan+'"></label>'+projField("e-proj",t.project)+
  '<div class="row"><button class="btn sm" data-act="esave" data-id="'+t.id+'">Mentés</button><button class="btn ghost sm" data-act="ecancel">Mégse</button></div></div>'}
/* Projects are free names on tasks; the field offers the names already in use. */
function projNames(){return [...new Set(S.tasks.map(t=>t.project).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"hu"))}
function projField(id,val){return '<label class="field"><span class="small">Projekt (nem kötelező)</span><input type="text" id="'+id+'" list="projlist" maxlength="40" value="'+esc(val||"")+'" placeholder="pl. Ajánlatok" autocomplete="off"></label>'+
  '<datalist id="projlist">'+projNames().map(n=>'<option value="'+esc(n)+'">').join("")+'</datalist>'}
try{const raw=localStorage.getItem(KEY);if(raw)S=normalize(JSON.parse(raw))}catch(e){}

/* ---------- dates & time ---------- */
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function today(){return ymd(new Date())}
function parseD(s){const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function weekDates(){const n=new Date(),i=(n.getDay()+6)%7,m=addDays(n,-i),a=[];for(let k=0;k<7;k++)a.push(ymd(addDays(m,k)));return a}
function longDate(d){return d.getFullYear()+". "+MONTHS[d.getMonth()]+" "+d.getDate()+"., "+DAYNAMES[d.getDay()]}
function shortDate(s){const p=s.split("-");return MONTHS[+p[1]-1].slice(0,3)+". "+(+p[2])+"."}
function dtype(s){const g=parseD(s).getDay();return(g===0||g===6)?"we":"wd"}
function tm(s){const m=/^(\d\d):(\d\d)$/.exec(s||"");return m?(+m[1])*60+(+m[2]):0}
function hm(m){m=Math.max(0,Math.min(1439,Math.round(m)));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}

/* ---------- format ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fm(m){m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?h+" ó "+r+" p":h+" ó"):r+" p"}
function fh(m){return (Math.round(m/6)/10).toLocaleString("hu-HU")+" ó"}

/* ---------- persistence ---------- */
let dbDoc=null,dbTimer=null,dbBusy=false,dbDirty=false;
function save(){S.updatedAt=Date.now();
  const cut=ymd(addDays(new Date(),-90));
  S.tasks=S.tasks.filter(t=>t.date>=cut||!t.completed&&t.date>=ymd(addDays(new Date(),-120)));
  for(const k of Object.keys(S.log))if(k<cut)delete S.log[k];
  for(const k of Object.keys(S.hourLog))if(k<cut)delete S.hourLog[k];
  for(const k of Object.keys(S.plan))if(k<cut)delete S.plan[k];
  for(const k of Object.keys(S.morning||{}))if(k<cut)delete S.morning[k];
  for(const k of Object.keys(S.sug||{}))if(k<cut)delete S.sug[k];
  for(const k of Object.keys(S.eqd||{}))if(k<cut)delete S.eqd[k];
  const cutF=addDays(new Date(),-90).getTime();S.feel=(S.feel||[]).filter(x=>x.at>=cutF);
  const cutMs=addDays(new Date(),-90).getTime();S.sessions=S.sessions.filter(x=>x.start>=cutMs);

function blockHtml(x,d,p){const b=x.b;
  if(b.kind==="edzes"){const wk=p.workout,tr=+S.settings.travel||0,dur=x.e-x.s;
    let h='<div class="blk'+(x.conf?" conf":"")+'" style="--c:var(--edzes)"><div class="bh">'+gripHtml(d,b)+'<h3>'+esc(b.title)+'</h3><span class="bt">'+b.start+"–"+b.end+'</span></div>'+
      '<div style="margin-top:8px">'+workoutSeg(d,wk)+'</div>';
    if(wk==="uszas")h+='<p class="cap">Úszás '+fm(dur)+', az út oda-vissza 2 × '+tr+' perc, az öltözés 2 × '+CHANGE+' perc, együtt '+fm(dur+2*tr+2*CHANGE)+'.</p>';
    else if(wk==="torna")h+='<p class="cap">Torna itthon, '+fm(dur)+'.</p>';
    else if(wk==="nincs")h+='<p class="cap">Ma pihenőnap, az edzés kihagyva.</p>';
    else h+='<p class="cap">Válassza ki, mi lesz az edzés.</p>';
    if(wk==="uszas"||wk==="torna")h+='<div class="row" style="margin-top:8px"><button class="btn sm" data-act="wdone" data-d="'+d+'">'+(p.workoutDone?"Megvolt – visszavonom":"Megvolt")+'</button></div>';
    h+=durRow(d,b)+moveRow(d,b);
    if(x.conf)h+='<p class="cap bad">Időben ütközik egy másik sávval.</p>';
    return h+'</div>'}
  const ts=S.tasks.filter(t=>t.date===d&&t.blockId===b.id),dur=x.e-x.s,planned=ts.reduce((a,t)=>a+t.plan,0),isToday=d===today();
  let h='<div class="blk'+(x.conf?" conf":"")+'"'+(b.mode?' style="--c:var(--'+b.mode+')"':"")+'><div class="bh">'+gripHtml(d,b)+'<h3>'+esc(b.title)+'</h3><span class="bt">'+b.start+"–"+b.end+'</span></div>'+
    '<p class="cap'+(planned>dur?" over":"")+'">'+(b.mode?MODES[b.mode]+", ":"")+(planned>dur?"a feladatok "+fm(planned-dur)+"-cal hosszabbak a sávnál":(planned?fm(planned)+" tervezve a "+fm(dur)+"-ból":fm(dur)+" szabad"))+'</p>';
  h+=durRow(d,b)+moveRow(d,b);

  if(ts.length)h+='<ul class="tasks">'+ts.map(t=>taskHtml(t,isToday)).join("")+'</ul>';
  h+='<div class="addrow"><input type="text" id="bt-'+b.id+'" maxlength="120" placeholder="Feladat ebbe a sávba" aria-label="Új feladat a sávba" autocomplete="off">'+
    '<button class="btn sm" data-act="badd" data-d="'+d+'" data-bid="'+b.id+'">Hozzáad</button></div>';
  return h+'</div>'}

/* Picks one of several phrasings by date, so the text stays the same within a day and changes from day to day. */

let petBusy=false;

  petBusy=true;el.classList.add("t-"+name);
  setTimeout(()=>{el.classList.remove("t-"+name);petBusy=false},{lick:2000,spin:1200,hop:1000,hearts:2300,dance:1900,flip:1300}[name]||1500)}
const petReduced=()=>window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
/* Every few seconds the pet may do a trick it has already learned. A sleepy pet stays quiet. */

  const lv=petLevel(S.petMins||0),a=PET_TRICKS.filter(x=>x[2]<=lv);petTrick(a[Math.floor(Math.random()*a.length)][0])},3000);

/* A few kind sentences about today, built only from today's own records. */
function dayStory(){const d=today(),on=S.settings.pet.on,n=petName(),d0=parseD(d).getTime(),
    ss=S.sessions.filter(x=>x.start>=d0&&x.start<d0+86400000&&x.actual>=1),mins=ss.reduce((a,x)=>a+x.actual,0),
    done=S.tasks.filter(t=>t.date===d&&t.completed),open=S.tasks.filter(t=>t.date===d&&!t.completed),out=[],P=(a,k)=>dayPick(a,"s"+k).replace(/\{n\}/g,n);
  if(!mins)out.push(P(["Ma nem gyűlt fókuszidő, és ez rendben van. Nem minden nap egyforma.","Ma más volt a fontos, nem a fókusz. Ez is egy nap, és így van jól."],0)+(on?" "+P(["{n} addig szunyókál egyet.","{n} holnap is itt lesz, és várja."],1):""));
  else{const tone=mins>=180?["Kiemelkedő nap volt.","Ez igazán tartalmas nap volt."]:mins>=60?["Szép, kiegyensúlyozott nap.","Jó ritmusú nap volt."]:["Kis lépés, de lépés.","Szerény, de valódi haladás."];
    out.push("Ma "+fm(mins)+" fókusz gyűlt össze "+ss.length+" blokkban. "+P(tone,2)+(on?" "+P(mins>=180?["{n} ma nagyon büszke Önre.","{n} ujjongva ünnepli a napot."]:mins>=60?["{n} elégedetten heverészik.","{n} jókedvűen nyújtózkodik."]:["{n} ennek is örül.","{n} minden percet értékel."],3):""));
    const best=ss.filter(x=>x.outcome==="igen").sort((a,b)=>b.actual-a.actual)[0];
    if(best)out.push("A legjobb blokk: „"+best.title+"”, "+fm(best.actual)+(best.intent?". Így indította: „"+best.intent+"”":"")+".")}
  const mo=S.morning[d];if(mo&&mo.text){const t=find(mo.taskId);
    out.push("Reggel ezt tűzte ki: „"+mo.text+"”. "+(t&&t.completed?P(["Sikerült, ez a nap csúcspontja.","Megcsinálta. Erre igazán büszke lehet."],5):P(["Ma nem jött össze, és ez nem baj. Holnap is lehet ez az egy dolog.","Ma nem fért bele. Holnap új esély."],6)))}
  const fe=S.feel.filter(x=>x.at>=d0&&x.at<d0+86400000);if(fe.length)out.push("Ma ezeket az érzéseket nevezte meg: "+[...new Set(fe.map(x=>x.w))].join(", ")+". Már az is sokat ér, hogy észrevette őket.");
  const eqd=S.eqd[d];if(eqd&&eqd.done)out.push("A mai kis lépést is megtette.");
  if(done.length)out.push(done.length+" feladatot zárt le, "+(done.length>1?"ezek már nem foglalják":"ez már nem foglalja")+" a fejét.");
  const dt=ss.reduce((a,x)=>a+(x.distractions||[]).length,0),dd=ss.reduce((a,x)=>a+(x.distractions||[]).filter(y=>y.taskId).length,0);
  if(dt)out.push("A blokkok közben "+dt+" zavaró gondolatot írt le, és nem hagyta elveszni"+(dd?" ("+dd+" teendő lett belőle)":"")+".");
  if(open.length)out.push(open.length+" feladat nyitva maradt. Holnap egy kattintással áthozhatja"+(open.length>1?" őket, most nem kell foglalkoznia velük.":", most nem kell foglalkoznia vele."));
  if(new Date().getHours()>=19)out.push(on?P(["{n} jó éjszakát kíván.","{n} már a helyén szuszog. Jó pihenést!","{n} holnap is itt lesz. Jó éjszakát!"],4):"Jó pihenést!");
  return out}

function ambient(kind){if(amb){try{amb.src.stop();amb.lfo&&amb.lfo.stop()}catch(e){}amb=null}ambKind="";
  if(!kind||kind==="csend"||!actx)return;
  try{const len=actx.sampleRate*4,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);let last=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==="eso")d[i]=w*.5;else{last=(last+.02*w)/1.02;d[i]=last*3.5}}
    const src=actx.createBufferSource();src.buffer=buf;src.loop=true;const g=actx.createGain();g.gain.value=kind==="eso"?.05:.22;let node=src;
    if(kind==="eso"){const f=actx.createBiquadFilter();f.type="bandpass";f.frequency.value=1400;f.Q.value=.6;src.connect(f);node=f}
    node.connect(g);g.connect(actx.destination);let lfo=null;
    if(kind==="ocean"){lfo=actx.createOscillator();lfo.frequency.value=.09;const lg=actx.createGain();lg.gain.value=.16;lfo.connect(lg);lg.connect(g.gain);lfo.start()}
    src.start();amb={src,lfo};ambKind=kind}catch(e){}}

/* The best part of the day: from rated sessions when they show a clear winner, else from where focus minutes went. */
function bestPart(){const st=sessStats(),a=st.byDay.filter(x=>x.rated>=3).sort((x,y)=>y.rate-x.rate);
  if(a.length>=2&&a[0].rate-a[1].rate>=.15)return a[0].k;
  const hb={reggel:0,delutan:0,este:0};Object.keys(S.hourLog).forEach(d=>Object.keys(S.hourLog[d]).forEach(h=>{const x=+h;hb[x>=5&&x<=11?"reggel":x>=12&&x<=16?"delutan":"este"]+=S.hourLog[d][h]}));
  const k=Object.keys(hb).sort((x,y)=>hb[y]-hb[x])[0];return hb[k]>=60?k:""}
/* Up to two open tasks of today without a block, the one thing and starred first, placed in upcoming blocks with room, best part of day first. */
function suggestDeep(){const d=today(),p=ensurePlan(d),n=new Date(),nm=n.getHours()*60+n.getMinutes(),bp=bestPart();
  const part=m=>{const h=Math.floor(m/60);return h>=5&&h<=11?"reggel":h>=12&&h<=16?"delutan":"este"};
  const free={};p.blocks.forEach(b=>{if(b.kind==="edzes"||b.mode==="pihenes")return;const s0=Math.max(nm,tm(b.start)),len=tm(b.end)-s0;
    if(len>0)free[b.id]=len-S.tasks.filter(t=>t.date===d&&t.blockId===b.id&&!t.completed).reduce((a,t)=>a+Math.max(0,t.plan-(t.done||0)),0)});
  const ids=p.blocks.map(b=>b.id),open=S.tasks.filter(t=>t.date===d&&!t.completed&&(!t.blockId||!ids.includes(t.blockId))&&t.plan-(t.done||0)>=25)
    .sort((a,b)=>(b.proud?2:0)+(b.star?1:0)-((a.proud?2:0)+(a.star?1:0))||b.plan-a.plan).slice(0,2);
  const blocks=p.blocks.filter(b=>free[b.id]>0).sort((a,b)=>(part(tm(b.start))===bp)-(part(tm(a.start))===bp)||tm(a.start)-tm(b.start));
  const out=[];open.forEach(t=>{const need=Math.min(t.plan-(t.done||0),+S.settings.focus||50);
    const g=blocks.find(b=>free[b.id]>=need&&(b.mode===t.mode||!b.mode))||blocks.find(b=>free[b.id]>=need);
    if(g){free[g.id]-=need;out.push({t,b:g,best:bp&&part(tm(g.start))===bp})}});
  return{out,bp}}

/* Groups the last 28 days of sessions by block length and by part of the day.

const LEN_B=[["rovid","Legfeljebb 30 perces",m=>m<=30],["kozep","31–60 perces",m=>m>30&&m<=60],["hosszu","60 percnél hosszabb",m=>m>60]];
const DAY_B=[["reggel","Reggel (5–11)",h=>h>=5&&h<=11],["delutan","Délután (12–16)",h=>h>=12&&h<=16],["este","Este és éjjel (17–4)",h=>h>=17||h<=4]];
function sessGroup(list,defs,key){return defs.map(g=>{const a=list.filter(x=>g[2](key(x))),r=a.filter(x=>x.outcome);
  const ok=r.reduce((n,x)=>n+(x.outcome==="igen"?1:x.outcome==="reszben"?.5:0),0),
        ints=a.reduce((n,x)=>n+(x.pauses||[]).length+(x.distractions||[]).length,0);
  return{k:g[0],label:g[1],n:a.length,rated:r.length,rate:r.length?ok/r.length:null,ints:a.length?ints/a.length:0,mins:a.reduce((n,x)=>n+x.actual,0)}})}
function sessStats(){const cut=Date.now()-28*86400000,list=S.sessions.filter(x=>x.start>=cut&&x.actual>=1);
  const dis={belso:0,kulso:0},why={zene:0,hivas:0,egyeb:0};
  list.forEach(x=>{(x.distractions||[]).forEach(d=>{if(dis[d.type]!==undefined)dis[d.type]++});(x.pauses||[]).forEach(q=>{if(why[q.k]!==undefined)why[q.k]++})});
  return{list,n:list.length,mins:list.reduce((a,x)=>a+x.actual,0),rated:list.filter(x=>x.outcome).length,
    byLen:sessGroup(list,LEN_B,x=>x.actual),byDay:sessGroup(list,DAY_B,x=>new Date(x.start).getHours()),dis,why}}

  const bd=best(st.byDay);if(bd)out.push("Leginkább a következő időszakban sikerül a fókusz: "+bd.label.toLowerCase()+" ("+Math.round(bd.rate*100)+"%). Érdemes ide tenni a nehezebb feladatot.");

function render(){if(!S.onboarded){document.getElementById("tabs").innerHTML="";document.getElementById("app").innerHTML=viewIntro();return}
  const beh=weekStatus().some(x=>x.behind);
  document.getElementById("tabs").innerHTML=[["ma","Ma"],["nap","Napirend"],["het","Hét"],["este","Este"],["beall","Beállítás"]].map(a=>
    '<button data-act="tab" data-v="'+a[0]+'"'+(view===a[0]?' aria-current="page"':"")+'>'+a[1]+(a[0]==="het"&&beh?'<span class="dot" aria-label="elmaradás"></span>':"")+(a[0]==="ma"&&S.timer&&view!=="ma"?'<span class="dot" style="background:var(--ok)" aria-label="fut az időmérő"></span>':"")+'</button>').join("");
  const dOn=deep&&S.timer&&S.timer.phase==="focus";if(!dOn&&deep&&!(S.timer&&S.timer.phase==="focus"))deep=false;
  document.getElementById("app").innerHTML=({ma:viewMa,nap:viewNapirend,het:viewHet,este:viewEste,beall:viewBeall})[view]()+(dOn?deepHtml():"")+(breathOn?breathHtml():"");
  const want=dOn&&!S.timer.pausedAt?(S.settings.ambient||"csend"):"";if(want!==ambKind)ambient(want);
  tick();countdown()}

/* ---------- events ---------- */
function setWorkout(d,v){const p=ensurePlan(d);
  if(p.workoutDone&&(v==="nincs"||v!==p.workout))undoWorkout(d,p);
  p.workout=(p.workout===v&&!p.workoutDone)?"":v}
function undoWorkout(d,p){if(p.workoutDone){uncredit("edzes",p.workoutCredit||0,d);p.workoutDone=false;p.workoutCredit=0}}

document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,t=b.dataset.id?find(b.dataset.id):null;
  if(a!=="reset")confirmReset=false;
  if(a!=="dayreset")confirmDay=false;
  switch(a){
    case "tab":view=b.dataset.v;openId=null;editPlan=false;window.scrollTo(0,0);break;
    case "gonap":view="nap";pDate=today();openId=null;editPlan=false;window.scrollTo(0,0);break;
    case "day":dayOff=+b.dataset.o;openId=null;break;
    case "open":openId=openId===b.dataset.id?null:b.dataset.id;break;
    case "edit":editId=t.id;editMode=t.mode;break;
    case "ecancel":editId=null;break;
    case "emode":{editMode=b.dataset.k;document.querySelectorAll('[data-act="emode"]').forEach(x=>x.setAttribute("aria-pressed",x.dataset.k===editMode));return}
    case "esave":{if(!t)return;const ti=document.getElementById("e-title"),pi=document.getElementById("e-plan"),title=ti.value.trim();
      if(!title){ti.focus();return}
      t.title=title;t.mode=editMode;t.plan=Math.min(600,Math.max(5,Math.round(+pi.value||t.plan)));
      const pj=document.getElementById("e-proj");t.project=pj?pj.value.trim().slice(0,40):(t.project||"");
      if(t.mode==="munka")t.star=false;
      editId=null;save();break}
    case "fmode":{formMode=b.dataset.k;document.querySelectorAll('[data-act="fmode"]').forEach(x=>x.setAttribute("aria-pressed",x.dataset.k===formMode));return}
    case "fplan":{formPlan=+b.dataset.m;const i=document.getElementById("f-plan");if(i)i.value="";
      document.querySelectorAll('[data-act="fplan"]').forEach(x=>x.setAttribute("aria-pressed",+x.dataset.m===formPlan));return}
    case "add":{const ti=document.getElementById("f-title"),pi=document.getElementById("f-plan"),title=ti.value.trim();
      if(!title){ti.focus();return}
      const plan=Math.min(600,Math.max(5,Math.round(+pi.value||formPlan||50)));
      const pj=document.getElementById("f-proj"),project=pj?pj.value.trim().slice(0,40):"";
      S.tasks.push({id:uid(),date:ymd(addDays(new Date(),dayOff)),title,mode:formMode,plan,done:0,star:false,completed:false,postponed:0,blockId:null,project});save();break}
    case "done":if(!t)return;
      if(!t.completed){t.completed=true;const diff=t.plan-(t.done||0);
        if(diff>0){credit(t,diff);t.auto={min:diff,date:today()}}
        if(S.timer&&S.timer.taskId===t.id&&S.timer.phase==="focus"){logSession(S.timer,Math.round(Math.min(tNow(S.timer)-S.timer.startAt,S.timer.durMs)/60000),Date.now(),"igen");S.timer=null;document.title="Horárium – napi fókusz"}}
      else{t.completed=false;if(t.auto){t.done=Math.max(0,t.done-t.auto.min);uncredit(t.mode,t.auto.min,t.auto.date);delete t.auto}}
      save();break;
    case "start":startFor=b.dataset.id;startDur=0;window.scrollTo(0,0);break;
    case "scancel":startFor=null;break;
    case "go":{const i=document.getElementById("s-intent"),w=document.getElementById("s-done"),mi=document.getElementById("s-min"),id=startFor;startFor=null;
      const mins=(mi&&+mi.value)||startDur||+S.settings.focus||50;startDur=0;
      startTimer(id,i?i.value.trim().slice(0,200):"",w?w.value.trim().slice(0,200):"",mins);window.scrollTo(0,0);return}
    case "sdur":{startDur=+b.dataset.m;const mi=document.getElementById("s-min");if(mi)mi.value="";
      document.querySelectorAll('[data-act="sdur"]').forEach(x=>x.setAttribute("aria-pressed",+x.dataset.m===startDur));return}
    case "extend":if(S.timer&&S.timer.phase==="focus"){S.timer.durMs+=10*60000;S.timer.extended=(S.timer.extended||0)+10;save()}break;
    case "refl":{const x=S.sessions.find(y=>y.id===S.reflect),d=document.getElementById("r-dist");
      if(x){x.outcome=b.dataset.o;x.distraction=d?d.value:"";if(feelSel)recordFeel(feelSel,x.id)}feelSel="";S.reflect=null;save();break}
    case "rskip":if(feelSel)recordFeel(feelSel,S.reflect);feelSel="";S.reflect=null;save();break;
    case "feel":if(b.dataset.ctx==="r"){feelSel=feelSel===b.dataset.w?"":b.dataset.w;document.querySelectorAll('[data-act="feel"][data-ctx="r"]').forEach(x=>x.setAttribute("aria-pressed",x.dataset.w===feelSel));return}
      recordFeel(b.dataset.w,"");feelOpen=false;save();break;
    case "feelopen":feelOpen=!feelOpen;break;
    case "eqdone":{const q=eqToday();S.eqd[q.d]=Object.assign(q.e,{done:true,a:q.a,i:q.i});S.eqDone=(S.eqDone||0)+1;
      if(S.settings.pet.on){S.petNote={at:Date.now(),text:petName()+" büszke Önre: ez a kis lépés is számít."};setTimeout(()=>petTrick("hearts"),500)}save();break}
    case "eqnext":{const q=eqToday();S.eqd[q.d]=Object.assign(q.e,{shift:(q.e.shift||0)+1});save();break}
    case "eqskip":{const q=eqToday();S.eqd[q.d]=Object.assign(q.e,{skip:true});save();break}
    case "eqask":{const q=eqToday();S.eqd[q.d]=Object.assign(q.e,{asked:true});save();break}
    case "breathe":breathOn=Date.now();break;
    case "breathend":breathOn=0;break;
    case "eqon":S.settings.eq.on=!S.settings.eq.on;save();break;
    case "eqfreq":S.settings.eq.freq=b.dataset.k;save();break;
    case "peton":S.settings.pet.on=!S.settings.pet.on;save();break;
    case "pspecies":if(PETS[b.dataset.k]){S.settings.pet.species=b.dataset.k;save()}break;
    case "petpoke":petTrick("hearts");return;
    case "prename":petRename=true;break;
    case "sugok":{const r=suggestDeep();r.out.forEach(x=>{x.t.blockId=x.b.id});S.sug[today()]="ok";flash=r.out.length+" feladat bekerült a napirendbe.";save();break}
    case "sugno":S.sug[today()]="skip";save();break;
    case "wsave":{const k=weekDates()[0],g=id=>{const e=document.getElementById(id);return e?e.value.trim():""};
      S.weekly[k]={good:g("w-good").slice(0,600),block:g("w-block").slice(0,600),change:g("w-change").slice(0,160),saved:Date.now()};flash="Heti visszatekintés mentve.";save();break}
    case "intro":introSaveName();introStep=+b.dataset.s;save();window.scrollTo(0,0);break;
    case "introPick":introSaveName();S.settings.pet.on=true;S.settings.pet.species=b.dataset.k;save();break;
    case "introNoPet":introSaveName();S.settings.pet.on=!S.settings.pet.on;save();break;
    case "introdone":{introSaveName();const i=document.getElementById("intro-one"),v=b.dataset.one&&i?i.value.trim().slice(0,120):"";
      if(S.settings.pet.on&&!S.settings.pet.name)S.settings.pet.name=PETS[S.settings.pet.species].def;
      if(v){const d=today(),id=uid();S.tasks.push({id,date:d,title:v,mode:"munka",plan:+S.settings.focus||50,done:0,star:false,completed:false,postponed:0,blockId:null,proud:true});S.morning[d]={text:v,taskId:id}}
      S.onboarded=true;introStep=0;view="ma";save();window.scrollTo(0,0);break}
    case "introAgain":S.onboarded=false;introStep=0;save();window.scrollTo(0,0);break;
    case "pname":{const i=document.getElementById("pet-name"),v=i?i.value.trim().slice(0,20):"";S.settings.pet.name=v||PETS[S.settings.pet.species].def;petRename=false;
      flash="Üdvözölje "+S.settings.pet.name+" nevű új társát!";save();render();setTimeout(()=>petTrick("hearts"),400);return}
    case "mosave":{const i=document.getElementById("mo-text"),v=i?i.value.trim().slice(0,120):"",d=today();if(!v){if(i)i.focus();return}
      const full=S.tasks.filter(x=>x.date===d&&x.star&&x.mode!=="munka").length>=3,id=uid();
      S.tasks.push({id,date:d,title:v,mode:formMode,plan:+S.settings.focus||50,done:0,star:formMode!=="munka"&&!full,completed:false,postponed:0,blockId:null,proud:true});
      S.morning[d]={text:v,taskId:id};save();render();setTimeout(()=>petTrick("hearts"),400);return}
    case "moskip":S.morning[today()]={skip:true};save();break;
    case "deepon":deep=true;ensureAudio();try{const r=document.documentElement;r.requestFullscreen&&r.requestFullscreen().catch(()=>{})}catch(e){}break;
    case "deepoff":deep=false;try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}break;
    case "amb":S.settings.ambient=b.dataset.k;ensureAudio();save();break;
    case "pause":pauseTimer();return;
    case "resume":resumeTimer();return;
    case "pwhy":{const p=S.timer&&(S.timer.pauses||[]).slice(-1)[0];if(p){p.k=b.dataset.k;save()}break}
    case "cap":capOpen=!capOpen;break;
    case "capsave":{const n=document.getElementById("c-note"),ty=document.getElementById("c-type"),note=n?n.value.trim().slice(0,200):"";
      if(!S.timer||!note){if(n)n.focus();return}
      const base=find(S.timer.taskId),dis={type:ty?ty.value:"belso",note,at:Date.now()};
      if(b.dataset.todo){const nt={id:uid(),date:today(),title:note,mode:base?base.mode:"munka",plan:25,done:0,star:false,completed:false,postponed:0,blockId:null};

    case "stop":stopTimer();return;
    case "plan":if(!t)return;t.plan=Math.min(600,Math.max(5,t.plan+(+b.dataset.d)));save();break;
    case "star":if(!t)return;
      if(t.mode==="munka"){flash="A munka-feladatok külön szakaszban vannak, a három legfontosabb közé nem kerülhetnek.";break}
      if(!t.star&&S.tasks.filter(x=>x.date===t.date&&x.star&&x.mode!=="munka").length>=3){flash="Már három feladat van kiemelve. Előbb vegyen ki egyet – a három éppen attól ér valamit, hogy csak három.";break}
      t.star=!t.star;save();break;
    case "postpone":if(!t)return;if(S.timer&&S.timer.taskId===t.id)stopTimer(true);
      t.date=ymd(addDays(new Date(),1));t.postponed=(t.postponed||0)+1;t.star=false;t.blockId=null;openId=null;
      if(t.postponed>=3)flash="„"+t.title+"” már "+t.postponed+" alkalommal került át másnapra. Érdemes dönteni róla.";save();break;
    case "del":if(!t)return;if(S.timer&&S.timer.taskId===t.id)stopTimer(true);S.tasks=S.tasks.filter(x=>x!==t);openId=null;save();break;
    case "carry":{const d=today();stale().forEach(x=>{x.date=d;x.postponed=(x.postponed||0)+1;x.star=false;x.blockId=null});save();break}
    case "drop":{const st=stale();S.tasks=S.tasks.filter(x=>!st.includes(x));save();break}

    case "pedit":editPlan=!editPlan;break;

    case "wset":setWorkout(b.dataset.d,b.dataset.v);save();break;
    case "wdone":{const d=b.dataset.d,p=ensurePlan(d);

      save();break}
    case "badd":{const d=b.dataset.d,p=ensurePlan(d),bl=p.blocks.find(x=>x.id===b.dataset.bid),inp=document.getElementById("bt-"+b.dataset.bid);
      if(!bl||!inp)return;const title=inp.value.trim();if(!title){inp.focus();return}
      const dur=Math.max(0,tm(bl.end)-tm(bl.start)),planned=S.tasks.filter(x=>x.date===d&&x.blockId===bl.id).reduce((s,x)=>s+x.plan,0),rem=dur-planned;
      const plan=rem>=15?Math.min(rem,+S.settings.focus||50):25;
      S.tasks.push({id:uid(),date:d,title,mode:(bl.mode&&bl.mode!=="edzes")?bl.mode:"munka",plan,done:0,star:false,completed:false,postponed:0,blockId:bl.id});save();break}
    case "baddblock":{const sc=b.dataset.s,bl=getBlocks(sc),kind=b.dataset.k==="edzes";
      const last=bl.length?tm(bl[bl.length-1].end):9*60,st=Math.min(last,22*60);
      bl.push(kind?blk(hm(st),hm(st+60),"Edzés","edzes","edzes"):blk(hm(st),hm(st+60),"Új sáv",""));sortBlocks(bl);save();break}
    case "bdur":{const m=resizeBlock(b.dataset.d,b.dataset.bid,+b.dataset.m);if(m)flash=m;save();break}
    case "replan":flash=replanToday();save();break;
    case "bmove":moveBlock(b.dataset.d,b.dataset.bid,+b.dataset.m);save();break;
    case "bdel":{const sc=b.dataset.s,bl=getBlocks(sc),i=bl.findIndex(x=>x.id===b.dataset.bid);
      if(i>=0){bl.splice(i,1);S.tasks.forEach(x=>{if(x.blockId===b.dataset.bid)x.blockId=null});save()}break}
    case "dayreset":if(!confirmDay){confirmDay=true;break}
      {const d=pDate,old=S.plan[d];if(old)undoWorkout(d,old);
       S.tasks.forEach(x=>{if(x.date===d)x.blockId=null});delete S.plan[d];ensurePlan(d);confirmDay=false;save();break}
    case "review":{const d=today(),r=S.reviews[d]||{};
      r.good=document.getElementById("r-good").value.trim();r.slip=document.getElementById("r-slip").value.trim();
      const first=document.getElementById("r-first").value.trim();const tmw=ymd(addDays(new Date(),1));
      if(first){const ex=r.taskId&&find(r.taskId);
        if(ex){ex.title=first;ex.mode=formMode}
        else{const id=uid();const full=S.tasks.filter(x=>x.date===tmw&&x.star).length>=3;
          S.tasks.push({id,date:tmw,title:first,mode:formMode,plan:+S.settings.focus||50,done:0,star:!full,completed:false,postponed:0,blockId:null});r.taskId=id}}
      const rq=document.getElementById("r-eq");if(rq){r.eq=rq.value.trim().slice(0,600);r.eqq=dayPick(EQ_EVE,"e")}
      r.first=first;S.reviews[d]=r;flash="Visszatekintés mentve."+(first?" A holnapi első feladat bekerült a holnapi listába.":"");save();break}
    case "export":exportData();return;
    case "impok":if(pendingImport){S=pendingImport;S.updatedAt=Date.now();pendingImport=null;save();flash="Az adatai visszatöltve."}break;
    case "impno":pendingImport=null;break;
    case "reset":if(!confirmReset){confirmReset=true;break}
      S=defaults();S.updatedAt=Date.now();confirmReset=false;save();view="ma";break;
  }
  render()});
/* Drag by the grip. The label shows the new time while the pointer moves; the move is saved on release. */
document.addEventListener("pointerdown",e=>{const g=e.target.closest&&e.target.closest("[data-grip]");if(!g||e.button>0)return;
  e.preventDefault();g.setPointerCapture(e.pointerId);const el=g.closest(".blk"),lab=el.querySelector(".bt");
  drag={pid:e.pointerId,y0:e.clientY,delta:0,d:g.dataset.d,bid:g.dataset.bid,el,lab,orig:lab.textContent};el.classList.add("dragging")});
document.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.pid)return;
  const delta=Math.round((e.clientY-drag.y0)/DRAG_PX/5)*5;if(delta===drag.delta)return;drag.delta=delta;
  const b=ensurePlan(drag.d).blocks.find(x=>x.id===drag.bid);if(!b)return;
  const[s,en]=blockSpan(drag.d,b,delta);drag.lab.textContent=hm(s)+"–"+hm(en);
  drag.el.style.transform="translateY("+(s-tm(b.start))*DRAG_PX+"px)"});
function endDrag(e,commit){if(!drag||e.pointerId!==drag.pid)return;const x=drag;drag=null;
  x.el.classList.remove("dragging");x.el.style.transform="";
  if(commit&&x.delta){moveBlock(x.d,x.bid,x.delta);save()}
  render()}
document.addEventListener("pointerup",e=>endDrag(e,true));
document.addEventListener("pointercancel",e=>endDrag(e,false));
/* Saves all data as a JSON file. Inside the Claude viewer the save goes through the downloads capability
   (the viewer confirms it); on a plain web page a normal download link is used. */
async function exportData(){const name="horarium-"+today()+".json",json=JSON.stringify(S,null,1);
  if(window.claude&&window.claude.use){let dl=null;try{dl=await window.claude.use("downloads")}catch(e){}
    if(!dl){flash="Ebben a nézetben a fájlba mentés nem érhető el. Nyissa meg az alkalmazást a weboldalán, és mentsen onnan.";render();return}
    try{await dl.save({filename:name,data:json});flash="Az adatai elmentve: "+name+"."}
    catch(e){flash=e&&e.code==="declined"?"A mentés elmaradt.":e&&e.code==="rate_limited"?"Egy mentés már folyamatban van, próbálja újra kicsit később.":"A mentés most nem sikerült."}
    render();return}
  const u=URL.createObjectURL(new Blob([json],{type:"application/json"})),l=document.createElement("a");
  l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
  flash="Az adatai elmentve: "+name+".";render()}
/* Reads a saved file and shows what it holds; nothing is replaced until the user confirms. */
function readImport(file){const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=="object"||!d.settings||!Array.isArray(d.tasks))throw 0;pendingImport=normalize(d)}
    catch(e){pendingImport=null;flash="Ez a fájl nem Horárium-mentés, ezért nem töltöttem vissza."}render()};
  r.readAsText(file)}
document.addEventListener("change",e=>{const i=e.target,ds=i.dataset||{};
  if(i.id==="imp-file"){if(i.files&&i.files[0])readImport(i.files[0]);return}
  if(!ds.set&&!ds.assign&&!ds.bf)return;
  if(ds.set==="petname"){S.settings.pet.name=i.value.trim().slice(0,20);save();render();return}
  if(ds.set){const v=+String(i.value).replace(",",".");
    if(ds.set==="target"){const T=S.settings.targets[ds.k];if(T)T[ds.t]=Math.min(100,Math.max(0,isFinite(v)?v:0))}
    if(ds.set==="focus")S.settings.focus=Math.min(180,Math.max(5,Math.round(v)||50));
    if(ds.set==="brk")S.settings.brk=Math.min(60,Math.max(1,Math.round(v)||10));
    if(ds.set==="travel")S.settings.travel=Math.min(120,Math.max(0,isFinite(v)?Math.round(v):20));
    save()}
  else if(ds.assign){const t=find(ds.assign);if(t){t.blockId=i.value||null;save()}}
  else if(ds.bf){const bl=getBlocks(ds.bs),b=bl.find(x=>x.id===ds.bid);
    if(b){const f=ds.bf;
      if(f==="title")b.title=i.value.trim()||"Sáv";
      else if(f==="mode")b.mode=i.value;
      else{b[f]=i.value;
        if(!/^\d\d:\d\d$/.test(b.start))b.start="09:00";
        if(!/^\d\d:\d\d$/.test(b.end))b.end=hm(tm(b.start)+60);
        if(tm(b.end)<=tm(b.start))b.end=hm(Math.min(1439,tm(b.start)+60));
        sortBlocks(bl)}
      save()}}
  render()});
document.addEventListener("input",e=>{if(e.target.id==="s-min"&&e.target.value){startDur=Math.min(180,Math.max(5,+e.target.value||0));
    document.querySelectorAll('[data-act="sdur"]').forEach(x=>x.setAttribute("aria-pressed","false"))}});
document.addEventListener("input",e=>{if(e.target.id==="f-plan"&&e.target.value){formPlan=+e.target.value||50;
  document.querySelectorAll('[data-act="fplan"]').forEach(x=>x.setAttribute("aria-pressed","false"))}});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const id=e.target.id||"";
  if(id==="f-title"){const b=document.querySelector('[data-act="add"]');if(b)b.click()}
  else if(id.indexOf("bt-")===0){const b=e.target.parentNode.querySelector("button");if(b)b.click()}});
/* Soft block: leaving the page during a focus block is noted kindly on return, and the time away is kept on the session. */
document.addEventListener("visibilitychange",()=>{const t=S.timer,f=t&&t.phase==="focus"&&!t.pausedAt;
  if(document.hidden){if(f){t.awayAt=Date.now();save()}return}
  if(t&&t.awayAt){const ms=Date.now()-t.awayAt;t.awayAt=null;
    if(f&&ms>=15000){t.away=(t.away||0)+ms;awayNote=(ms<60000?Math.round(ms/1000)+" másodpercig":Math.round(ms/60000)+" percig")+" máshol járt. Semmi baj, folytassuk."}save()}
  render()});
window.addEventListener("beforeunload",e=>{if(deep&&S.timer&&S.timer.phase==="focus"&&!S.timer.pausedAt){e.preventDefault();e.returnValue=""}});
render();
</script>
