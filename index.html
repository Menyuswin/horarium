<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horárium – napi fókusz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EDF0EC; --surface:#FAFBF9; --ink:#16252A; --muted:#5A696C; --line:#D2D9D4; --soft:#E3E8E3;
  --tanulas:#4548B0; --munka:#0E6E66; --szabad:#A86C06; --pihenes:#A13F6B; --edzes:#587A12;
  --warn:#8F3210; --warn-bg:#FAE8DC; --ok:#0E6E66;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10191C; --surface:#18252A; --ink:#E6ECE8; --muted:#94A4A5; --line:#2B3B40; --soft:#213036;
    --tanulas:#9A9DF2; --munka:#4FC2B6; --szabad:#E4AE4C; --pihenes:#E58DB4; --edzes:#A9CC5C;
    --warn:#F3B594; --warn-bg:#3A2218; --ok:#4FC2B6;
  }
}
:root[data-theme="dark"]{
  --bg:#10191C; --surface:#18252A; --ink:#E6ECE8; --muted:#94A4A5; --line:#2B3B40; --soft:#213036;
  --tanulas:#9A9DF2; --munka:#4FC2B6; --szabad:#E4AE4C; --pihenes:#E58DB4; --edzes:#A9CC5C;
  --warn:#F3B594; --warn-bg:#3A2218; --ok:#4FC2B6;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.4;
  -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Alegreya",Georgia,"Times New Roman",serif;font-weight:700;margin:0;line-height:1.15}
h1{font-size:1.9rem} h2{font-size:1.25rem;margin:1.6rem 0 .6rem} h3{font-size:1.05rem}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
main{max-width:620px;margin:0 auto;padding:18px 16px 96px}
.muted{color:var(--muted)} .small{font-size:.9rem}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.head .date{color:var(--muted)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{min-height:54px;font-weight:500;font-size:.9rem;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--ink);font-weight:700}
nav .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:4px;vertical-align:middle}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.alert strong{font-weight:700}
.alert .row{margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.sm{min-height:38px;padding:0 12px;font-size:.92rem}
.alert .btn.ghost{color:var(--warn);border-color:currentColor}

.strip{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft);margin:10px 0 8px}
.strip i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.9rem;color:var(--muted)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

.timer{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.timer svg{width:128px;height:128px;flex:none}
.timer .time{font-family:"Alegreya",Georgia,serif;font-weight:700;font-size:26px;fill:var(--ink);font-variant-numeric:tabular-nums}
.timer .info{min-width:0;flex:1}
.timer .info p{margin-bottom:8px}

.days{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.days button{min-height:38px;padding:0 14px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
ul.tasks{list-style:none;margin:0;padding:0}
.task{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;margin-bottom:8px}
.task .top{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 4px}
.task .check{width:44px;height:44px;flex:none;display:grid;place-items:center}
.task .check span{width:22px;height:22px;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-size:14px;line-height:1}
.task.done .check span{background:var(--c);border-color:var(--c);color:var(--surface)}
.task .body{flex:1;min-width:0;text-align:left;padding:6px 2px;min-height:44px}
.task .title{display:block;font-weight:500;overflow-wrap:anywhere}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.task .meta{display:block;font-size:.88rem;color:var(--muted)}
.task .meta em{font-style:normal;color:var(--c);font-weight:700}
.task .late{color:var(--warn);font-weight:700}
.task .play{width:44px;height:44px;flex:none;border-radius:50%;background:var(--c);color:var(--surface);font-size:15px;display:grid;place-items:center}
.task .more{border-top:1px solid var(--line);padding:8px}
.slot{border:1px dashed var(--line);border-radius:10px;padding:11px 14px;color:var(--muted);margin-bottom:8px;font-size:.95rem}

.field{display:block;margin-bottom:10px}
.field>span{display:block;font-weight:500;margin-bottom:4px}
input[type=text],input[type=number],input[type=time],textarea,select{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:76px;resize:vertical}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
.modes button{min-height:42px;border:1px solid var(--line);border-radius:10px;border-left:5px solid var(--c);text-align:left;padding:0 10px}
.modes button[aria-pressed="true"]{background:var(--c);color:var(--surface);font-weight:700;border-color:var(--c)}
.chips button{min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:19px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.chips input{width:86px;min-height:38px}

.wk{margin-bottom:16px}
.wk .lab{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.wk .lab b{color:var(--c)}
.bar{position:relative;height:16px;background:var(--soft);border-radius:8px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--c)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.wk .note{font-size:.9rem;margin-top:4px}
.wk .note.bad{color:var(--warn);font-weight:500}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:var(--muted);font-family:"Alegreya Sans",sans-serif}
.review{border-top:1px solid var(--line);padding:10px 0}
.review p{margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.pills{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.pills button{min-height:54px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.pills button small{color:var(--muted);font-size:.78rem}
.pills button.we{background:var(--soft)}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pills button[aria-pressed="true"] small{color:inherit}
.pills button.today b{text-decoration:underline}
.blk{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--line));border-radius:12px;padding:10px 12px;margin-bottom:8px}
.blk.conf{border-color:var(--warn)}
.blk .bh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.blk .bt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem;white-space:nowrap}
.blk .cap{font-size:.88rem;color:var(--muted);margin-top:2px}
.blk .cap.over,.blk .cap.bad{color:var(--warn);font-weight:700}
.blk ul.tasks{margin-top:8px}
.blk .addrow{display:flex;gap:6px;margin-top:8px}
.blk .addrow input{min-width:0}
.travel{color:var(--muted);font-size:.9rem;padding:4px 12px 4px 14px;margin-bottom:8px;border-left:2px dashed var(--line)}
.brow{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:12px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0;padding-top:0}
.brow .full{grid-column:1/-1}
.brow .field{margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.wkgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wkgrid div{border:1px solid var(--line);border-radius:8px;padding:6px 2px;font-size:.82rem;line-height:1.25;min-height:54px}
.wkgrid .ok{background:var(--soft);font-weight:700}
.tgt{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.tgt input{min-height:42px}
@media (prefers-reduced-motion:no-preference){.bar i,.strip i{transition:width .3s}}
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="Nézetek"><div id="tabs"></div></nav>
<script>
"use strict";
const MODES={tanulas:"Tanulás",munka:"Munka",szabad:"Szabadprogram",pihenes:"Pihenés",edzes:"Edzés"};
const MK=Object.keys(MODES);
const KEY="horarium-v1";
const DAYS=["H","K","Sze","Cs","P","Szo","V"];
const MONTHS=["január","február","március","április","május","június","július","augusztus","szeptember","október","november","december"];
const DAYNAMES=["vasárnap","hétfő","kedd","szerda","csütörtök","péntek","szombat"];
const WORKOUTS={uszas:"Úszás",torna:"Torna",nincs:"Pihenőnap"};
const MAX_FOCUS_BLOCKS=6;
const BREAK_TIPS=["Álljon fel, és nyújtózzon két percet.","Igyon egy pohár vizet.","Nézzen ki az ablakon húsz másodpercig.","Menjen ki a szobából, és járjon egy kört.","Ne nyissa meg a telefont és a közösségi oldalakat: a szünet pihenés legyen.","Lazítsa el a vállát, és lassan lélegezzen néhányat."];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function blk(start,end,title,mode,kind){const b={id:uid(),start,end,title,mode:mode||""};if(kind)b.kind=kind;return b}
function defTemplates(){return{
  wd:[blk("07:00","08:00","Tanulás","tanulas"),blk("08:00","09:00","Reggeli, készülődés","pihenes"),
      blk("09:00","12:30","Munka","munka"),blk("12:30","13:30","Ebéd","pihenes"),blk("13:30","16:30","Munka","munka"),
      blk("17:00","18:00","Edzés","edzes","edzes"),blk("18:30","20:00","Szabadprogram","szabad"),blk("20:00","22:00","Esti pihenés","pihenes")],
  we:[blk("07:30","08:30","Reggeli, lassú indulás","pihenes"),blk("08:30","10:30","Tanulás","tanulas"),
      blk("11:00","12:00","Edzés","edzes","edzes"),blk("12:30","13:30","Ebéd","pihenes"),
      blk("14:30","18:30","Szabadprogram","szabad"),blk("19:00","22:00","Esti pihenés","pihenes")]}}
function defTargets(){return{tanulas:{wd:5,we:2},munka:{wd:30,we:0},szabad:{wd:7,we:6},pihenes:{wd:15,we:8},edzes:{wd:5,we:2}}}
function defaults(){return{v:2,updatedAt:0,
  settings:{targets:defTargets(),focus:50,brk:10,travel:20,templates:defTemplates()},
  tasks:[],log:{},hourLog:{},reviews:{},timer:null,plan:{}}}
function normalize(d){d=JSON.parse(JSON.stringify(d||{}));const b=defaults(),ds=d.settings||{};
  const s=Object.assign(b,d);s.v=2;
  s.settings=Object.assign(b.settings,ds);
  const tg=defTargets();MK.forEach(k=>{const t=(ds.targets||{})[k];
    if(t&&typeof t==="object")tg[k]={wd:+t.wd||0,we:+t.we||0};});
  s.settings.targets=tg;
  const tp=ds.templates;
  s.settings.templates=(tp&&Array.isArray(tp.wd)&&Array.isArray(tp.we))?tp:defTemplates();
  s.tasks=Array.isArray(d.tasks)?d.tasks:[];s.log=d.log||{};s.hourLog=d.hourLog||{};s.reviews=d.reviews||{};s.timer=d.timer||null;s.plan=d.plan||{};return s}

let S=defaults(),view="ma",dayOff=0,openId=null,formMode="munka",formPlan=50,confirmReset=false,confirmDay=false,
    flash="",syncOn=false,pDate=null,editPlan=false;
try{const raw=localStorage.getItem(KEY);if(raw)S=normalize(JSON.parse(raw))}catch(e){}

/* ---------- dates & time ---------- */
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function today(){return ymd(new Date())}
function parseD(s){const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function weekDates(){const n=new Date(),i=(n.getDay()+6)%7,m=addDays(n,-i),a=[];for(let k=0;k<7;k++)a.push(ymd(addDays(m,k)));return a}
function longDate(d){return d.getFullYear()+". "+MONTHS[d.getMonth()]+" "+d.getDate()+"., "+DAYNAMES[d.getDay()]}
function shortDate(s){const p=s.split("-");return MONTHS[+p[1]-1].slice(0,3)+". "+(+p[2])+"."}
function dtype(s){const g=parseD(s).getDay();return(g===0||g===6)?"we":"wd"}
function tm(s){const m=/^(\d\d):(\d\d)$/.exec(s||"");return m?(+m[1])*60+(+m[2]):0}
function hm(m){m=Math.max(0,Math.min(1439,Math.round(m)));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}

/* ---------- format ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fm(m){m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?h+" ó "+r+" p":h+" ó"):r+" p"}
function fh(m){return (Math.round(m/6)/10).toLocaleString("hu-HU")+" ó"}

/* ---------- persistence ---------- */
let dbDoc=null,dbTimer=null,dbBusy=false,dbDirty=false;
function save(){S.updatedAt=Date.now();
  const cut=ymd(addDays(new Date(),-90));
  S.tasks=S.tasks.filter(t=>t.date>=cut||!t.completed&&t.date>=ymd(addDays(new Date(),-120)));
  for(const k of Object.keys(S.log))if(k<cut)delete S.log[k];
  for(const k of Object.keys(S.hourLog))if(k<cut)delete S.hourLog[k];
  for(const k of Object.keys(S.plan))if(k<cut)delete S.plan[k];
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(dbDoc){dbDirty=true;clearTimeout(dbTimer);dbTimer=setTimeout(pushDb,900)}}
async function pushDb(){if(!dbDoc||dbBusy)return;dbBusy=true;dbDirty=false;
  try{await dbDoc.set(JSON.parse(JSON.stringify(S)))}catch(e){}
  dbBusy=false;if(dbDirty)dbTimer=setTimeout(pushDb,900)}
(async()=>{try{
  if(!window.claude||!window.claude.use)return;
  const[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  if(!db||!user)return;const id=await user.id();if(!id)return;
  const doc=db.collection("data/users/"+id).doc("state");
  const snap=await doc.get();dbDoc=doc;syncOn=true;
  if(snap.exists){const d=snap.data();
    if((d.updatedAt||0)>(S.updatedAt||0)){S=normalize(d);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
    else if((S.updatedAt||0)>(d.updatedAt||0))pushDb()}
  else if(S.updatedAt)pushDb();
  render()}catch(e){}})();

/* ---------- plan (napirend) ---------- */
function ensurePlan(d){if(!S.plan[d]){const tpl=S.settings.templates[dtype(d)]||[];
  S.plan[d]={blocks:tpl.map(b=>Object.assign({},b,{id:uid()})).sort((a,b)=>tm(a.start)-tm(b.start)),workout:"",workoutDone:false}}
  return S.plan[d]}
function getBlocks(scope){return(scope==="wd"||scope==="we")?S.settings.templates[scope]:ensurePlan(scope).blocks}
function sortBlocks(bl){bl.sort((a,b)=>tm(a.start)-tm(b.start)||tm(a.end)-tm(b.end))}
const CHANGE=10;
function dayItems(d){const p=ensurePlan(d),out=[],tr=+S.settings.travel||0;
  p.blocks.forEach(b=>{const s=tm(b.start),e=tm(b.end);out.push({type:"block",b,s,e});
    if(b.kind==="edzes"&&p.workout==="uszas"){
      if(tr>0)out.push({type:"travel",s:s-CHANGE-tr,e:s-CHANGE,label:"Út az uszodába"});
      out.push({type:"travel",s:s-CHANGE,e:s,label:"Öltözés az úszás előtt"});
      out.push({type:"travel",s:e,e:e+CHANGE,label:"Öltözés az úszás után"});
      if(tr>0)out.push({type:"travel",s:e+CHANGE,e:e+CHANGE+tr,label:"Út haza az uszodából"})}});
  const off=x=>x.type==="block"&&x.b.kind==="edzes"&&p.workout==="nincs";
  out.sort((a,b)=>a.s-b.s||a.e-b.e);
  out.forEach(x=>{x.conf=!off(x)&&out.some(y=>y!==x&&!off(y)&&x.s<y.e&&y.s<x.e)});
  return out}
function dayPlanMins(d){const p=ensurePlan(d),by={};MK.forEach(k=>by[k]=0);
  p.blocks.forEach(b=>{if(b.mode&&by[b.mode]!==undefined&&!(b.kind==="edzes"&&p.workout==="nincs"))by[b.mode]+=Math.max(0,tm(b.end)-tm(b.start))});return by}
function workoutMins(p){const b=p.blocks.find(x=>x.kind==="edzes");return b?Math.max(0,tm(b.end)-tm(b.start)):60}

/* ---------- domain ---------- */
function find(id){return S.tasks.find(t=>t.id===id)}
function credit(t,min,date){if(min<=0)return;t.done=(t.done||0)+min;const d=date||today();
  S.log[d]=S.log[d]||{};S.log[d][t.mode]=(S.log[d][t.mode]||0)+min}
function hourCredit(min,when){if(min<=0)return;const d=ymd(when),h=when.getHours();
  S.hourLog[d]=S.hourLog[d]||{};S.hourLog[d][h]=(S.hourLog[d][h]||0)+min}
function uncredit(mode,min,date){if(S.log[date]){S.log[date][mode]=Math.max(0,(S.log[date][mode]||0)-min)}}
function weekTotals(){const w=weekDates(),o={};MK.forEach(k=>o[k]=0);
  w.forEach(d=>{const l=S.log[d];if(l)MK.forEach(k=>o[k]+=l[k]||0)});return o}
function weekStatus(){const n=new Date(),i=(n.getDay()+6)%7,w=weekDates();
  const frac=Math.min(1,Math.max(0,(n.getHours()+n.getMinutes()/60-7)/15)),left=7-i;
  return MK.map(k=>{const T=S.settings.targets[k]||{wd:0,we:0},tw=(+T.wd||0)*60,te=(+T.we||0)*60;
    let exp=0;for(let d=0;d<=i;d++){const dt=d<5?tw/5:te/2;exp+=d<i?dt:dt*frac}
    let dw=0,de=0;w.forEach((dd,j)=>{const v=(S.log[dd]||{})[k]||0;if(j<5)dw+=v;else de+=v});
    const done=dw+de,target=tw+te;
    return{k,target,done,exp,tw,te,dw,de,left,
      behind:target>0&&done<exp*0.75&&exp-done>=30,
      perDay:Math.max(0,target-done)/left}})}
function stale(){const t=today();return S.tasks.filter(x=>x.date<t&&!x.completed)}

/* ---------- timer ---------- */
let actx=null;
/* Three rounds of a rising arpeggio and a high double hit: hard to miss, short enough to repeat. */
const MELODY=[[523.25,.12],[659.25,.12],[783.99,.12],[1046.5,.18],[0,.08],[1318.5,.12],[1318.5,.25],[0,.2]];
function ensureAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
function beep(){try{if(!actx)return;let t=actx.currentTime+.05;
  for(let r=0;r<3;r++)MELODY.forEach(([f,d])=>{if(f){const os=actx.createOscillator(),g=actx.createGain();
    os.type="square";os.frequency.value=f;os.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.01);

let alertStamp=Date.now();
function alertsDue(){const now=Date.now(),from=Math.max(alertStamp,now-30000);alertStamp=now;
  if(!S.settings.alerts)return;
  const d=today(),p=S.plan[d];if(!p)return;const base=parseD(d).getTime(),msgs=[];
  const hit=m=>{const ms=base+m*60000;return ms>from&&ms<=now};
  p.blocks.forEach(b=>{if(b.kind==="edzes"&&p.workout==="nincs")return;
    if(hit(tm(b.start)))msgs.push({title:"Indul: "+b.title,body:b.start+"–"+b.end});
    if(hit(tm(b.end)))msgs.push({title:"Lejárt az idő: "+b.title,body:"Vége: "+b.end})});
  if(!msgs.length)return;
  beep();msgs.forEach(x=>notify(x.title,x.body));
  flash=msgs.map(x=>x.title).join(" · ");render()}

function startTimer(id){ensureAudio();
  if(S.timer)stopTimer(true);
  S.timer={taskId:id,phase:"focus",startAt:Date.now(),durMs:(+S.settings.focus||50)*60000};save();render()}
function stopTimer(silent){const t=S.timer;if(!t)return;
  if(t.phase==="focus"){const el=Math.min(Date.now()-t.startAt,t.durMs),m=Math.round(el/60000),task=find(t.taskId);
    if(task&&m>=1){credit(task,m);hourCredit(m,new Date(t.startAt))}}
  S.timer=null;document.title="Horárium – napi fókusz";if(!silent){save();render()}}
function tick(){const t=S.timer;if(!t)return;const now=Date.now(),end=t.startAt+t.durMs;
  if(now>=end){
    if(t.phase==="focus"){const task=find(t.taskId);if(task){credit(task,Math.round(t.durMs/60000),ymd(new Date(end)));hourCredit(Math.round(t.durMs/60000),new Date(t.startAt))}
      S.timer={taskId:t.taskId,phase:"break",startAt:end,durMs:(+S.settings.brk||10)*60000};beep();notify("Lejárt a fókuszidő",task?task.title:"Szünet következik");save();render();return tick()}
    S.timer=null;document.title="Horárium – napi fókusz";beep();notify("Szünet vége","Indulhat a következő blokk.");save();render();return}
  const rem=Math.ceil((end-now)/1000),txt=String(Math.floor(rem/60)).padStart(2,"0")+":"+String(rem%60).padStart(2,"0");
  const el=document.getElementById("t-time"),ring=document.getElementById("t-ring");
  if(el)el.textContent=txt;if(ring)ring.setAttribute("stroke-dashoffset",(339.29*(1-(now-t.startAt)/t.durMs)).toFixed(1));
  document.title=txt+(t.phase==="focus"?" – fókusz":" – szünet")}

  h+='<div class="panel">'+st.map(x=>{const max=Math.max(x.target,x.done,1);
    return '<div class="wk" style="--c:var(--'+x.k+')"><div class="lab"><b>'+MODES[x.k]+'</b><span>'+fh(x.done)+" / "+fh(x.target)+'</span></div>'+
    '<div class="bar"><i style="width:'+(x.done/max*100)+'%"></i>'+(x.target?'<u style="left:'+(x.exp/max*100)+'%"></u>':"")+'</div>'+
    '<p class="note muted">Hétköznap '+fh(x.dw)+" / "+fh(x.tw)+", hétvége "+fh(x.de)+" / "+fh(x.te)+'</p>'+
    (x.target?'<p class="note'+(x.behind?" bad":" muted")+'">'+(x.done>=x.target?"A heti cél teljesült.":(x.behind?"Elmaradás: "+fh(x.exp-x.done)+". ":"")+"A hátralévő "+x.left+" napra napi "+fh(x.perDay)+" jut.")+'</p>':'<p class="note muted">Nincs heti cél beállítva.</p>')+'</div>'}).join("")+'</div>';
  h+='<h2>Edzések a héten</h2><div class="panel"><div class="wkgrid">'+w.map((dd,i)=>{const p=S.plan[dd],wk=p&&p.workout;
    return '<div class="'+(p&&p.workoutDone?"ok":"")+'"><b>'+DAYS[i]+'</b><br>'+(wk?WORKOUTS[wk]:"–")+(p&&p.workoutDone?'<br>✓':"")+'</div>'}).join("")+'</div>'+
    '<p class="muted small" style="margin-top:8px">'+w.filter(dd=>S.plan[dd]&&S.plan[dd].workoutDone).length+' edzés készült el, ebből '+
    w.filter(dd=>S.plan[dd]&&S.plan[dd].workoutDone&&S.plan[dd].workout==="uszas").length+' úszás.</p></div>';
  const tot=w.map(d=>MK.map(k=>(S.log[d]||{})[k]||0)),mx=Math.max(60,...tot.map(a=>a.reduce((x,y)=>x+y,0)));
  let svg='<svg class="chart" viewBox="0 0 320 150" role="img" aria-label="Napi ráfordítás módok szerint">';
  tot.forEach((a,i)=>{let y=120;const x=14+i*43;a.forEach((m,j)=>{if(!m)return;const hh=m/mx*104;y-=hh;
      svg+='<rect x="'+x+'" y="'+y.toFixed(1)+'" width="30" height="'+hh.toFixed(1)+'" fill="var(--'+MK[j]+')"/>'});
    const s=a.reduce((p,q)=>p+q,0);
    if(s)svg+='<text x="'+(x+15)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle">'+(Math.round(s/6)/10).toLocaleString("hu-HU")+'</text>';
    svg+='<text x="'+(x+15)+'" y="138" text-anchor="middle"'+(w[i]===today()?' style="font-weight:700;fill:var(--ink)"':"")+'>'+DAYS[i]+'</text>'});
  svg+='<line x1="8" y1="120.5" x2="312" y2="120.5" stroke="var(--line)"/></svg>';
  h+='<h2>Napi ráfordítás (óra)</h2><div class="panel">'+svg+'<div class="legend" style="margin-top:6px">'+MK.map(k=>'<span><b style="background:var(--'+k+')"></b>'+MODES[k]+'</span>').join("")+'</div></div>';
  const wt=S.tasks.filter(t=>w.includes(t.date)),pl=wt.reduce((a,t)=>a+t.plan,0),dn=wt.reduce((a,t)=>a+(t.done||0),0);
  const cut28=ymd(addDays(new Date(),-27)),hb={reggel:0,delutan:0,este:0};
  Object.keys(S.hourLog).filter(d=>d>=cut28).forEach(d=>Object.keys(S.hourLog[d]).forEach(hr=>{const x=+hr,m=S.hourLog[d][hr],k=x>=5&&x<=11?"reggel":x>=12&&x<=16?"delutan":"este";hb[k]+=m}));
  const ht=hb.reggel+hb.delutan+hb.este,lab={reggel:"Reggel (5–11)",delutan:"Délután (12–16)",este:"Este és éjjel (17–4)"};
  h+='<h2>Mikor dolgozik a legjobban</h2><div class="panel">';
  if(ht<60)h+='<p class="muted">Az elmúlt 4 hétből még kevés adat van ('+fm(ht)+' fókusz). Néhány fókuszblokk után itt látszik a mintázat.</p>';
  else{const best=Object.keys(hb).sort((a,b)=>hb[b]-hb[a])[0];
    h+='<p style="margin-bottom:8px">A fókuszidő legnagyobb része: <b>'+lab[best]+'</b>.</p>'+Object.keys(hb).map(k=>'<div class="wk" style="--c:var(--munka)"><div class="lab"><span>'+lab[k]+'</span><span>'+Math.round(hb[k]/ht*100)+'%</span></div><div class="bar"><i style="width:'+(hb[k]/ht*100)+'%"></i></div></div>').join("")}
  h+='</div>';
  h+='<h2>Terv és valóság</h2><div class="panel"><p>A héten '+fm(pl)+' munkát tervezett feladatokba, ebből '+fm(dn)+' valósult meg'+(pl?" ("+Math.round(dn/pl*100)+"%)":"")+'. '+wt.filter(t=>t.completed).length+' feladat készült el a '+wt.length+'-ból.</p></div>';
  const late=S.tasks.filter(t=>!t.completed&&(t.postponed||0)>=2).sort((a,b)=>b.postponed-a.postponed);
  h+='<h2>Halasztott feladatok</h2>'+(late.length?'<ul class="tasks">'+late.map(t=>'<li class="task" style="--c:var(--'+t.mode+')"><div class="top" style="padding:10px 12px"><span class="body"><span class="title">'+esc(t.title)+'</span><span class="meta"><span class="'+(t.postponed>=3?"late":"")+'">'+t.postponed+'× halasztva</span>, '+MODES[t.mode].toLowerCase()+", "+fm(t.plan)+'</span></span></div></li>').join("")+'</ul>'
    :'<p class="muted">Nincs többször elhalasztott feladata.</p>');
  return h}

function viewEste(){const d=today(),r=S.reviews[d]||{};
  let h='<div class="head"><div><h1>Esti két perc</h1><p class="date">Három rövid válasz, hogy a holnap ne a nulláról induljon.</p></div></div>';
  if(flash){h+='<div class="alert" role="status" style="background:var(--soft);color:var(--ink)">'+esc(flash)+'</div>';flash=""}
  const tl=S.log[d]||{},sum=MK.reduce((a,k)=>a+(tl[k]||0),0);
  h+='<p class="muted" style="margin-bottom:12px">Mai ráfordítás: '+(sum?MK.filter(k=>tl[k]).map(k=>MODES[k].toLowerCase()+" "+fm(tl[k])).join(", "):"még nincs rögzített idő")+'.</p>';
  h+='<div class="panel"><label class="field"><span>Mi ment jól ma?</span><textarea id="r-good" maxlength="600">'+esc(r.good||"")+'</textarea></label>'+
    '<label class="field"><span>Mi csúszott el, és miért?</span><textarea id="r-slip" maxlength="600">'+esc(r.slip||"")+'</textarea></label>'+
    '<label class="field"><span>Mi lesz a holnapi első feladat?</span><input type="text" id="r-first" maxlength="120" value="'+esc(r.first||"")+'" autocomplete="off"></label>'+
    '<div class="modes" role="group" aria-label="A holnapi első feladat módja">'+MK.map(k=>'<button data-act="fmode" data-k="'+k+'" style="--c:var(--'+k+')" aria-pressed="'+(formMode===k)+'">'+MODES[k]+'</button>').join("")+'</div>'+
    '<button class="btn" data-act="review">Visszatekintés mentése</button>'+
    '<p class="muted small" style="margin-top:8px">A holnapi első feladat kiemelve bekerül a holnapi listába.</p></div>';
  const old=Object.keys(S.reviews).filter(k=>k<d).sort().reverse().slice(0,7);
  if(old.length)h+='<h2>Korábbi visszatekintések</h2>'+old.map(k=>{const x=S.reviews[k];return '<div class="review"><h3>'+shortDate(k)+'</h3>'+
    (x.good?'<p><span class="muted">Jól ment:</span> '+esc(x.good)+'</p>':"")+(x.slip?'<p><span class="muted">Elcsúszott:</span> '+esc(x.slip)+'</p>':"")+(x.first?'<p><span class="muted">Másnapi első:</span> '+esc(x.first)+'</p>':"")+'</div>'}).join("");
  return h}

function viewBeall(){const s=S.settings,T=s.targets;
  let h='<div class="head"><div><h1>Beállítások</h1><p class="date">A heti célokhoz méri az alkalmazás az elmaradást.</p></div></div>';
  const sw=MK.reduce((a,k)=>a+(+T[k].wd||0),0),se=MK.reduce((a,k)=>a+(+T[k].we||0),0);
  h+='<h2 style="margin-top:0">Heti célok (óra)</h2><div class="panel"><div class="tgt"><span></span><b class="small">Hétköznap (H–P)</b><b class="small">Hétvége (Szo–V)</b></div>'+
    MK.map(k=>'<div class="tgt"><span style="color:var(--'+k+');font-weight:700">'+MODES[k]+'</span>'+
      '<input type="number" min="0" max="100" step="0.5" inputmode="decimal" aria-label="'+MODES[k]+', hétköznap, óra" data-set="target" data-k="'+k+'" data-t="wd" value="'+T[k].wd+'">'+
      '<input type="number" min="0" max="100" step="0.5" inputmode="decimal" aria-label="'+MODES[k]+', hétvége, óra" data-set="target" data-k="'+k+'" data-t="we" value="'+T[k].we+'"></div>').join("")+
    '<p class="muted small">Hétköznap összesen '+sw.toLocaleString("hu-HU")+' óra, hétvégén '+se.toLocaleString("hu-HU")+' óra. A hétköznapi órák öt napra, a hétvégiek két napra oszlanak.</p></div>';
  h+='<h2>Hétköznapi napirend-sablon</h2><div class="panel">'+blockRows(s.templates.wd,"wd")+addBlockBtns("wd")+'</div>';
  h+='<h2>Hétvégi napirend-sablon</h2><div class="panel">'+blockRows(s.templates.we,"we")+addBlockBtns("we")+
    '<p class="muted small" style="margin-top:8px">A sablon az újonnan megnyitott napokra érvényes. Egy konkrét nap sávjait a Napirend nézetben módosíthatja.</p></div>';
  h+='<h2>Edzés és fókuszritmus</h2><div class="panel"><div class="grid2"><label class="field"><span>Út az uszodába (perc, egy irány)</span><input type="number" min="0" max="120" step="5" inputmode="numeric" data-set="travel" value="'+s.travel+'"></label><span></span>'+
    '<div class="row chips" role="group" aria-label="Fókusz-ritmus" style="margin-bottom:12px">'+[[25,5,"Gyors: 25/5"],[50,10,"Mély: 50/10"]].map(p=>'<button data-act="preset" data-f="'+p[0]+'" data-b="'+p[1]+'" aria-pressed="'+(s.focus===p[0]&&s.brk===p[1])+'">'+p[2]+'</button>').join("")+'</div>'+
    '<label class="field"><span>Fókuszblokk (perc)</span><input type="number" min="5" max="180" step="5" inputmode="numeric" data-set="focus" value="'+s.focus+'"></label>'+
    '<label class="field"><span>Szünet (perc)</span><input type="number" min="1" max="60" inputmode="numeric" data-set="brk" value="'+s.brk+'"></label></div>'+
    '<p class="muted small">A blokk végén hangjelzés szól, ha az alkalmazás nyitva van.</p></div>';
  h+='<h2>Jelzések</h2><div class="panel"><p style="margin-bottom:10px">'+(S.settings.alerts?"Hang és értesítés jelzi, amikor egy napirendi sáv elkezdődik vagy véget ér, és amikor a fókuszidő lejár.":"Kikapcsolva. Bekapcsolva hang és értesítés jelzi a napirendi sávok kezdését és végét.")+'</p>'+
    '<button class="btn'+(S.settings.alerts?"":" ghost")+'" data-act="alerts">'+(S.settings.alerts?"Kikapcsolás":"Bekapcsolás")+'</button>'+
    (S.settings.alerts&&"Notification"in window&&Notification.permission==="denied"?'<p class="muted small" style="margin-top:8px">Az értesítés tiltva van a böngészőben, ezért csak a hang szól.</p>':"")+'</div>';
  h+='<h2>Adatok</h2><div class="panel"><p style="margin-bottom:10px">'+(syncOn?"Az adatai a fiókjához kötve mentődnek, így másik eszközön is ugyanezt látja.":"Az adatai jelenleg ezen az eszközön, ebben a böngészőben mentődnek.")+'</p>'+
    '<button class="btn ghost" data-act="reset">'+(confirmReset?"Biztosan törlöm az összes adatot":"Minden adat törlése")+'</button></div>';
  return h}

function render(){const beh=weekStatus().some(x=>x.behind);
  document.getElementById("tabs").innerHTML=[["ma","Ma"],["nap","Napirend"],["het","Hét"],["este","Este"],["beall","Beállítás"]].map(a=>
    '<button data-act="tab" data-v="'+a[0]+'"'+(view===a[0]?' aria-current="page"':"")+'>'+a[1]+(a[0]==="het"&&beh?'<span class="dot" aria-label="elmaradás"></span>':"")+(a[0]==="ma"&&S.timer&&view!=="ma"?'<span class="dot" style="background:var(--ok)" aria-label="fut az időmérő"></span>':"")+'</button>').join("");
  document.getElementById("app").innerHTML=({ma:viewMa,nap:viewNapirend,het:viewHet,este:viewEste,beall:viewBeall})[view]();
  tick()}

/* ---------- events ---------- */
function setWorkout(d,v){const p=ensurePlan(d);
  if(p.workoutDone&&(v==="nincs"||v!==p.workout))undoWorkout(d,p);
  p.workout=(p.workout===v&&!p.workoutDone)?"":v}
function undoWorkout(d,p){if(p.workoutDone){uncredit("edzes",p.workoutCredit||0,d);p.workoutDone=false;p.workoutCredit=0}}

document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,t=b.dataset.id?find(b.dataset.id):null;
  if(a!=="reset")confirmReset=false;
  if(a!=="dayreset")confirmDay=false;
  switch(a){
    case "tab":view=b.dataset.v;openId=null;editPlan=false;window.scrollTo(0,0);break;
    case "gonap":view="nap";pDate=today();openId=null;editPlan=false;window.scrollTo(0,0);break;
    case "day":dayOff=+b.dataset.o;openId=null;break;
    case "open":openId=openId===b.dataset.id?null:b.dataset.id;break;
    case "fmode":{formMode=b.dataset.k;document.querySelectorAll('[data-act="fmode"]').forEach(x=>x.setAttribute("aria-pressed",x.dataset.k===formMode));return}
    case "fplan":{formPlan=+b.dataset.m;const i=document.getElementById("f-plan");if(i)i.value="";
      document.querySelectorAll('[data-act="fplan"]').forEach(x=>x.setAttribute("aria-pressed",+x.dataset.m===formPlan));return}
    case "add":{const ti=document.getElementById("f-title"),pi=document.getElementById("f-plan"),title=ti.value.trim();
      if(!title){ti.focus();return}
      const plan=Math.min(600,Math.max(5,Math.round(+pi.value||formPlan||50)));
      S.tasks.push({id:uid(),date:ymd(addDays(new Date(),dayOff)),title,mode:formMode,plan,done:0,star:false,completed:false,postponed:0,blockId:null});save();break}
    case "done":if(!t)return;
      if(!t.completed){t.completed=true;const diff=t.plan-(t.done||0);
        if(diff>0){credit(t,diff);t.auto={min:diff,date:today()}}
        if(S.timer&&S.timer.taskId===t.id&&S.timer.phase==="focus"){S.timer=null;document.title="Horárium – napi fókusz"}}
      else{t.completed=false;if(t.auto){t.done=Math.max(0,t.done-t.auto.min);uncredit(t.mode,t.auto.min,t.auto.date);delete t.auto}}
      save();break;
    case "start":startTimer(b.dataset.id);window.scrollTo(0,0);return;
    case "stop":stopTimer();return;
    case "plan":if(!t)return;t.plan=Math.min(600,Math.max(5,t.plan+(+b.dataset.d)));save();break;
    case "star":if(!t)return;
      if(t.mode==="munka"){flash="A munka-feladatok külön szakaszban vannak, a három legfontosabb közé nem kerülhetnek.";break}
      if(!t.star&&S.tasks.filter(x=>x.date===t.date&&x.star&&x.mode!=="munka").length>=3){flash="Már három feladat van kiemelve. Előbb vegyen ki egyet – a három éppen attól ér valamit, hogy csak három.";break}
      t.star=!t.star;save();break;
    case "postpone":if(!t)return;if(S.timer&&S.timer.taskId===t.id)stopTimer(true);
      t.date=ymd(addDays(new Date(),1));t.postponed=(t.postponed||0)+1;t.star=false;t.blockId=null;openId=null;
      if(t.postponed>=3)flash="„"+t.title+"” már "+t.postponed+" alkalommal került át másnapra. Érdemes dönteni róla.";save();break;
    case "del":if(!t)return;if(S.timer&&S.timer.taskId===t.id)stopTimer(true);S.tasks=S.tasks.filter(x=>x!==t);openId=null;save();break;
    case "carry":{const d=today();stale().forEach(x=>{x.date=d;x.postponed=(x.postponed||0)+1;x.star=false;x.blockId=null});save();break}
    case "drop":{const st=stale();S.tasks=S.tasks.filter(x=>!st.includes(x));save();break}
    case "pday":pDate=b.dataset.d;openId=null;editPlan=false;confirmDay=false;break;
    case "pedit":editPlan=!editPlan;break;
    case "preset":S.settings.focus=+b.dataset.f;S.settings.brk=+b.dataset.b;save();break;
    case "alerts":S.settings.alerts=!S.settings.alerts;if(S.settings.alerts){ensureAudio();askNotify();alertStamp=Date.now()}save();break;
    case "wset":setWorkout(b.dataset.d,b.dataset.v);save();break;
    case "wdone":{const d=b.dataset.d,p=ensurePlan(d);
      if(p.workoutDone)undoWorkout(d,p);
      else if(p.workout==="uszas"||p.workout==="torna"){const m=workoutMins(p);
        S.log[d]=S.log[d]||{};S.log[d].edzes=(S.log[d].edzes||0)+m;p.workoutDone=true;p.workoutCredit=m}
      save();break}
    case "badd":{const d=b.dataset.d,p=ensurePlan(d),bl=p.blocks.find(x=>x.id===b.dataset.bid),inp=document.getElementById("bt-"+b.dataset.bid);
      if(!bl||!inp)return;const title=inp.value.trim();if(!title){inp.focus();return}
      const dur=Math.max(0,tm(bl.end)-tm(bl.start)),planned=S.tasks.filter(x=>x.date===d&&x.blockId===bl.id).reduce((s,x)=>s+x.plan,0),rem=dur-planned;
      const plan=rem>=15?Math.min(rem,+S.settings.focus||50):25;
      S.tasks.push({id:uid(),date:d,title,mode:(bl.mode&&bl.mode!=="edzes")?bl.mode:"munka",plan,done:0,star:false,completed:false,postponed:0,blockId:bl.id});save();break}
    case "baddblock":{const sc=b.dataset.s,bl=getBlocks(sc),kind=b.dataset.k==="edzes";
      const last=bl.length?tm(bl[bl.length-1].end):9*60,st=Math.min(last,22*60);
      bl.push(kind?blk(hm(st),hm(st+60),"Edzés","edzes","edzes"):blk(hm(st),hm(st+60),"Új sáv",""));sortBlocks(bl);save();break}
    case "bdel":{const sc=b.dataset.s,bl=getBlocks(sc),i=bl.findIndex(x=>x.id===b.dataset.bid);
      if(i>=0){bl.splice(i,1);S.tasks.forEach(x=>{if(x.blockId===b.dataset.bid)x.blockId=null});save()}break}
    case "dayreset":if(!confirmDay){confirmDay=true;break}
      {const d=pDate,old=S.plan[d];if(old)undoWorkout(d,old);
       S.tasks.forEach(x=>{if(x.date===d)x.blockId=null});delete S.plan[d];ensurePlan(d);confirmDay=false;save();break}
    case "review":{const d=today(),r=S.reviews[d]||{};
      r.good=document.getElementById("r-good").value.trim();r.slip=document.getElementById("r-slip").value.trim();
      const first=document.getElementById("r-first").value.trim();const tmw=ymd(addDays(new Date(),1));
      if(first){const ex=r.taskId&&find(r.taskId);
        if(ex){ex.title=first;ex.mode=formMode}
        else{const id=uid();const full=S.tasks.filter(x=>x.date===tmw&&x.star).length>=3;
          S.tasks.push({id,date:tmw,title:first,mode:formMode,plan:+S.settings.focus||50,done:0,star:!full,completed:false,postponed:0,blockId:null});r.taskId=id}}
      r.first=first;S.reviews[d]=r;flash="Visszatekintés mentve."+(first?" A holnapi első feladat bekerült a holnapi listába.":"");save();break}
    case "reset":if(!confirmReset){confirmReset=true;break}
      S=defaults();S.updatedAt=Date.now();confirmReset=false;save();view="ma";break;
  }
  render()});
document.addEventListener("change",e=>{const i=e.target,ds=i.dataset||{};
  if(!ds.set&&!ds.assign&&!ds.bf)return;
  if(ds.set){const v=+String(i.value).replace(",",".");
    if(ds.set==="target"){const T=S.settings.targets[ds.k];if(T)T[ds.t]=Math.min(100,Math.max(0,isFinite(v)?v:0))}
    if(ds.set==="focus")S.settings.focus=Math.min(180,Math.max(5,Math.round(v)||50));
    if(ds.set==="brk")S.settings.brk=Math.min(60,Math.max(1,Math.round(v)||10));
    if(ds.set==="travel")S.settings.travel=Math.min(120,Math.max(0,isFinite(v)?Math.round(v):20));
    save()}
  else if(ds.assign){const t=find(ds.assign);if(t){t.blockId=i.value||null;save()}}
  else if(ds.bf){const bl=getBlocks(ds.bs),b=bl.find(x=>x.id===ds.bid);
    if(b){const f=ds.bf;
      if(f==="title")b.title=i.value.trim()||"Sáv";
      else if(f==="mode")b.mode=i.value;
      else{b[f]=i.value;
        if(!/^\d\d:\d\d$/.test(b.start))b.start="09:00";
        if(!/^\d\d:\d\d$/.test(b.end))b.end=hm(tm(b.start)+60);
        if(tm(b.end)<=tm(b.start))b.end=hm(Math.min(1439,tm(b.start)+60));
        sortBlocks(bl)}
      save()}}
  render()});
document.addEventListener("input",e=>{if(e.target.id==="f-plan"&&e.target.value){formPlan=+e.target.value||50;
  document.querySelectorAll('[data-act="fplan"]').forEach(x=>x.setAttribute("aria-pressed","false"))}});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const id=e.target.id||"";
  if(id==="f-title"){const b=document.querySelector('[data-act="add"]');if(b)b.click()}
  else if(id.indexOf("bt-")===0){const b=e.target.parentNode.querySelector("button");if(b)b.click()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
render();
</script>
</body>
